litellm_settings:
  drop_params: true

model_list:
  # All Claude Code tiers route to Omni (supports text + images).
  # Ultra/Super/Nano text-only models reject screenshots with:
  # "multimodal processing is not enabled"

  - model_name: nvidia-nemotron-lightning
    litellm_params:
      rpm: 40
      model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY1
      additional_drop_params: ["context_management", "output_config"]

  - model_name: nvidia-deepseek-ultra
    litellm_params:
      rpm: 40
      model: nvidia_nim/deepseek-ai/deepseek-v4-flash
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY1
      additional_drop_params: ["context_management", "output_config"]

  - model_name: nvidia-nemotron-nano
    litellm_params:
      rpm: 40
      model: nvidia_nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY1
      additional_drop_params: ["context_management", "output_config"]

  - model_name: nvidia-kimi-omni
    litellm_params:
      rpm: 40
      model: nvidia_nim/moonshotai/kimi-k2.6
      api_base: https://integrate.api.nvidia.com/v1
